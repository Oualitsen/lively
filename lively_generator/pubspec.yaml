name: lively_generator
description: Code generator for the lively reactive Flutter widget package.
version: 1.3.0
homepage: https://github.com/Oualitsen/lively
repository: https://github.com/Oualitsen/lively
issue_tracker: https://github.com/Oualitsen/lively/issues

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.4.0
  build: ^4.0.11
  source_gen: ^4.3.0
  lively: ^1.2.0

dev_dependencies:
  build_test: ^3.5.20
  logging: ^1.3.0
  test: ^1.32.0

# Overrides the hosted lively constraint with the local path during
# development. pub.dev ignores dependency_overrides when resolving
# published packages, so this does not affect consumers.
dependency_overrides:
  lively:
    path: ../
